appId: com.opc.agent.workspace
productName: OPC Agent 工作台
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# Native addons and the loadable SQLite extension cannot run from inside asar.
asarUnpack:
  - '**/*.node'
  - 'node_modules/sqlite-vec*/**'
  - 'node_modules/better-sqlite3/**'
mac:
  category: public.app-category.productivity
  target:
    - target: dir
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlementsInherit: build/entitlements.mac.plist
win:
  target:
    - nsis
linux:
  target:
    - AppImage
  category: Office
